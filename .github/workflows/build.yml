name: Build VST3+Vocals LoadFirst
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target VST3PlusVocalsLoadFirst_VST3 --parallel 2
      - name: Stage complete VST3 bundle
        shell: pwsh
        run: |
          $p=Get-ChildItem build -Recurse -Directory -Filter "VST3+Vocals LoadFirst.vst3" |
            Where-Object { Test-Path (Join-Path $_.FullName "Contents\x86_64-win\VST3+Vocals LoadFirst.vst3") } |
            Select-Object -First 1
          if(-not $p){throw "VST3 bundle not found"}
          $bin=Join-Path $p.FullName "Contents\x86_64-win\VST3+Vocals LoadFirst.vst3"
          if((Get-Item $bin).Length -lt 100000){throw "VST3 binary too small"}
          $stage=Join-Path $env:RUNNER_TEMP "Install"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse -Force $p.FullName (Join-Path $stage "VST3+Vocals LoadFirst.vst3")
          "PACKAGE_PATH=$stage" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: VST3PlusVocals-LOAD-FIRST-INSTALL
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error
