name: Build VST3+Vocals Match
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target VST3PlusVocalsMatch_VST3 --parallel 2
      - name: Verify VST3
        shell: pwsh
        run: |
          $p=Get-ChildItem build -Recurse -Directory -Filter "VST3+Vocals Match.vst3" | Where-Object { Test-Path (Join-Path $_.FullName "Contents\x86_64-win\VST3+Vocals Match.vst3") } | Select-Object -First 1
          if(-not $p){throw "VST3 bundle not found"}
          $bin=Join-Path $p.FullName "Contents\x86_64-win\VST3+Vocals Match.vst3"
          if((Get-Item $bin).Length -lt 100000){throw "VST3 binary too small"}
          $mi=Join-Path $p.FullName "Contents\Resources\moduleinfo.json"
          if(-not (Test-Path $mi)){throw "moduleinfo.json missing"}
          "PLUGIN_PATH=$($p.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: VST3PlusVocals-Match-Windows
          path: ${{ env.PLUGIN_PATH }}
          if-no-files-found: error
