name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show build tools
        shell: pwsh
        run: |
          cmake --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target VST3PlusVocal_VST3 --parallel 2

      - name: Locate and verify VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem build -Recurse -Directory -Filter "VST3PlusVocal.vst3" |
            Where-Object { Test-Path (Join-Path $_.FullName "Contents\x86_64-win\VST3PlusVocal.vst3") } |
            Select-Object -First 1
          if (-not $plugin) { Write-Error "Complete VST3 bundle not found"; exit 1 }
          $binary = Join-Path $plugin.FullName "Contents\x86_64-win\VST3PlusVocal.vst3"
          if (-not (Test-Path $binary -PathType Leaf)) { Write-Error "VST3 binary missing"; exit 1 }
          if ((Get-Item $binary).Length -lt 100000) { Write-Error "VST3 binary unexpectedly small"; exit 1 }
          "PLUGIN_PATH=$($plugin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VST3PlusVocal-Windows
          path: ${{ env.PLUGIN_PATH }}
          if-no-files-found: error
