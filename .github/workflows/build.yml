name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target VST3PlusVocal_VST3

      - name: Locate VST3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "VST3PlusVocal.vst3" | Select-Object -First 1
          if (-not $plugin) {
            Write-Error "VST3PlusVocal.vst3 was not found."
            exit 1
          }
          Write-Host "Found plugin: $($plugin.FullName)"
          "PLUGIN_PATH=$($plugin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify VST3 binary
        shell: pwsh
        run: |
          $binary = Join-Path $env:PLUGIN_PATH "Contents\x86_64-win\VST3PlusVocal.vst3"
          if (-not (Test-Path $binary)) {
            Write-Error "VST3 binary is missing: $binary"
            exit 1
          }
          Write-Host "Binary OK: $binary"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VST3PlusVocal-Windows
          path: ${{ env.PLUGIN_PATH }}
          if-no-files-found: error
