name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target VST3PlusVocal_VST3 --parallel 2
      - name: Locate VST3
        shell: pwsh
        run: |
          $p=Get-ChildItem build -Recurse -Directory -Filter "VST3PlusVocal.vst3" | Where-Object { Test-Path (Join-Path $_.FullName "Contents\x86_64-win\VST3PlusVocal.vst3") } | Select-Object -First 1
          if(-not $p){throw "VST3 bundle not found"}
          "PLUGIN_PATH=$($p.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: VST3PlusVocal-Windows
          path: ${{ env.PLUGIN_PATH }}
          if-no-files-found: error
